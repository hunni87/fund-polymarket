name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 의존성 설치
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check app tests scripts

      - name: pytest
        run: python -m pytest -q

      - name: 마이그레이션이 모델과 일치하는지 확인
        env:
          DATABASE_URL: postgresql+psycopg://fund:fund@localhost:5432/fund
        run: |
          alembic upgrade head
          alembic check

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fund
          POSTGRES_PASSWORD: fund
          POSTGRES_DB: fund
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fund"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

  frontend:
    name: 프론트엔드 (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npm run typecheck

      - name: 빌드
        run: npm run build
